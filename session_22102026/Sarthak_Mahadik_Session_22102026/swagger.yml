openapi: 3.0.3

info:
  title: Todo List Application
  version: 1.0.0
  description: API for managing todos, categories, user profiles, and authentication

servers:
  - url: http://localhost:8080

tags:
  - name: todos
    description: Todo management operations
  - name: categories
    description: Todo category operations
  - name: users
    description: User profile operations
  - name: auth
    description: Authentication operations

paths:
  /todos:
    get:
      tags:
        - todos
      summary: Get, search, and filter todos
      description: Search by todo ID or title and filter by status, priority, or category.
      operationId: getTodos
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Search todos by ID or title
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, completed]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high]
        - name: category
          in: query
          description: Filter todos by category
          schema:
            type: string
      responses:
        '200':
          description: List of todos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
        '401':
          description: Authentication required

    post:
      tags:
        - todos
      summary: Create a todo
      operationId: createTodo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
      responses:
        '201':
          description: Todo created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Invalid todo information
        '401':
          description: Authentication required

  /todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - todos
      summary: Get a todo by ID
      operationId: getTodo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Todo found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          description: Authentication required
        '404':
          description: Todo not found

    put:
      tags:
        - todos
      summary: Update a todo
      operationId: updateTodo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
      responses:
        '200':
          description: Todo updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Invalid todo information
        '401':
          description: Authentication required
        '404':
          description: Todo not found

    patch:
      tags:
        - todos
      summary: Update todo status
      description: Mark a todo as completed or pending again.
      operationId: updateTodoStatus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, completed]
      responses:
        '200':
          description: Todo status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Invalid status
        '401':
          description: Authentication required
        '404':
          description: Todo not found

    delete:
      tags:
        - todos
      summary: Delete a todo
      operationId: deleteTodo
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Todo deleted successfully
        '401':
          description: Authentication required
        '404':
          description: Todo not found

  /categories:
    get:
      tags:
        - categories
      summary: Get todo categories
      operationId: getCategories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          description: Authentication required

    post:
      tags:
        - categories
      summary: Create a category
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Invalid category information
        '401':
          description: Authentication required

  /categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    put:
      tags:
        - categories
      summary: Update a category
      operationId: updateCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Invalid category information
        '401':
          description: Authentication required
        '404':
          description: Category not found

    delete:
      tags:
        - categories
      summary: Delete a category
      operationId: deleteCategory
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Category deleted successfully
        '401':
          description: Authentication required
        '404':
          description: Category not found

  /users/me:
    get:
      tags:
        - users
      summary: Get the current user's profile
      operationId: getUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Authentication required

    patch:
      tags:
        - users
      summary: Update the current user's profile
      operationId: updateUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileInput'
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid profile information
        '401':
          description: Authentication required

  /auth/login:
    post:
      tags:
        - auth
      summary: Log in to an account
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid login credentials

  /auth/logout:
    post:
      tags:
        - auth
      summary: Log out of an account
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout successful
        '401':
          description: Authentication required

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TodoInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [pending, completed]
          default: pending
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        categoryId:
          type: integer
          nullable: true

    Todo:
      allOf:
        - $ref: '#/components/schemas/TodoInput'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true

    CategoryInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1

    Category:
      allOf:
        - $ref: '#/components/schemas/CategoryInput'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              readOnly: true

    UserProfileInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1

    UserProfile:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          type: string
          description: Authentication token used to access protected endpoints
        tokenType:
          type: string
          example: Bearer
