openapi: 3.0.3

info:
  title: Todo List Application
  version: 1.0.0
  description: API for managing todos

servers:
  - url: http://localhost:8080

tags:
  - name: todos
    description: Todo management operations

paths:
  /todos:
    get:
      tags:
        - todos
      summary: Get, list, and filter todos
      description: Retrieve all todos or filter by status, priority, category, or search term.
      operationId: getTodos
      parameters:
        - name: search
          in: query
          description: Search todos by title
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, completed]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high]
        - name: category
          in: query
          description: Filter todos by category
          schema:
            type: string
        - name: archived
          in: query
          description: Filter archived or active todos
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of todos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
        '400':
          description: Invalid filter parameters

    post:
      tags:
        - todos
      summary: Create a todo
      operationId: createTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
      responses:
        '201':
          description: Todo created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Invalid todo information

  /todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - todos
      summary: Get a todo by ID
      operationId: getTodo
      responses:
        '200':
          description: Todo found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          description: Todo not found

    put:
      tags:
        - todos
      summary: Update a todo
      operationId: updateTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
      responses:
        '200':
          description: Todo updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Invalid todo information
        '404':
          description: Todo not found

    delete:
      tags:
        - todos
      summary: Delete a todo
      operationId: deleteTodo
      responses:
        '204':
          description: Todo deleted successfully
        '404':
          description: Todo not found

  /todos/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    patch:
      tags:
        - todos
      summary: Archive a todo
      description: Move a todo to the archived state.
      operationId: archiveTodo
      responses:
        '200':
          description: Todo archived successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          description: Todo not found

components:
  schemas:
    TodoInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [pending, completed]
          default: pending
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        category:
          type: string
          nullable: true

    Todo:
      allOf:
        - $ref: '#/components/schemas/TodoInput'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              readOnly: true
            archived:
              type: boolean
              default: false
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true