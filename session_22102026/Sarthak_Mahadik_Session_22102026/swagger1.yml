openapi: 3.0.3
info:
  title: Todo Management API
  version: 1.0.0
  description: API for creating, listing, filtering, retrieving, updating, archiving, and deleting todos.

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Todos
    description: Todo management operations

paths:
  /todos:
    post:
      tags: [Todos]
      summary: Create a Todo
      operationId: createTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
            example:
              title: Buy groceries
              description: Buy milk and bread
              status: pending
              priority: medium
              dueDate: '2026-10-30'
      responses:
        '201':
          description: Todo created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Invalid todo information

    get:
      tags: [Todos]
      summary: List and filter Todos
      operationId: listTodos
      description: Returns todos with optional search, status, priority, category, and archived filters.
      parameters:
        - name: search
          in: query
          description: Search by todo title or description
          schema:
            type: string
        - name: status
          in: query
          description: Filter by completion status
          schema:
            type: string
            enum: [pending, completed]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high]
        - name: category
          in: query
          description: Filter by category name
          schema:
            type: string
        - name: archived
          in: query
          description: Include or filter archived todos
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Todos retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [items, page, limit, total]